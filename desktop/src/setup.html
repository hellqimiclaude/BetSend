<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; font-src 'self'" />
    <title>BetSend</title>
    <style>
      /* Bundled with the app: this page is shown before a server address is
         known, so the web app's self-hosted fonts are out of reach. Latin
         only -- this window is chrome, not content. */
      @font-face { font-family: Inter; font-weight: 400; font-display: swap;
                   src: url('fonts/inter-400-latin.woff2') format('woff2'); }
      @font-face { font-family: Inter; font-weight: 600; font-display: swap;
                   src: url('fonts/inter-600-latin.woff2') format('woff2'); }
      @font-face { font-family: Montserrat; font-weight: 700; font-display: swap;
                   src: url('fonts/montserrat-700-latin.woff2') format('woff2'); }

      /* BetLive's palette, same values as the web app's Tailwind config:
         the green is its Sign In button, the darks are its page background,
         header bar and input fields. */
      :root { color-scheme: light dark; --bg: #f7f7f9; --fg: #101118; --muted: #74747f;
              --line: #c3c3cd; --field: #ffffff; --brand: #d60421; --bad: #b0031b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #101118; --fg: #eeeef2; --muted: #9d9da9; --line: #2e2e38;
                --field: #202128; --brand: #f50628; --bad: #ff99a9; }
      }
      * { box-sizing: border-box; }
      body { font: 15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg);
             margin: 0; padding: 32px 34px; }
      h1 { font: 700 1.3rem/1.3 Montserrat, "Segoe UI", system-ui, sans-serif;
           letter-spacing: -.01em; margin: 0 0 .35rem; }
      p.lede { color: var(--muted); margin: 0 0 1.5rem; }
      label { display: block; font-weight: 600; margin-bottom: .4rem; }
      input { width: 100%; padding: .65rem .8rem; font: inherit; border-radius: .5rem;
              border: 1px solid var(--line); background: var(--field); color: inherit; }
      input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgb(245 6 40 / .22); }
      .hint { color: var(--muted); font-size: .85rem; margin-top: .45rem; }
      button { margin-top: 1.5rem; width: 100%; padding: .7rem 1rem; font: inherit; font-weight: 600;
               color: #fff; background: var(--brand); border: 0; border-radius: .5rem; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      .message { margin-top: 1rem; font-size: .9rem; min-height: 1.2rem; }
      .message.bad { color: var(--bad); }
      .message.good { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Connect to BetSend</h1>
    <p class="lede">Enter the address of the BetSend server in your office.</p>

    <form id="form">
      <label for="address">Server address</label>
      <input id="address" name="address" autofocus spellcheck="false" autocomplete="off"
             placeholder="betsend-pc" />
      <p class="hint">The computer name or IP address, for example <b>betsend-pc</b> or
        <b>192.168.1.5:8080</b>. Whoever installed BetSend can tell you.</p>
      <button id="submit" type="submit">Connect</button>
      <p class="message" id="message"></p>
    </form>

    <script src="setup.js"></script>
  </body>
</html>
