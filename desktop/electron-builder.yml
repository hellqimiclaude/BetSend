appId: com.betlive.betsend
productName: BetSend
copyright: BetLive

directories:
  output: ../dist-desktop
  buildResources: build

# The compiled app. electron-builder adds the production dependencies in
# package.json on top of this -- tus-js-client and electron-updater both
# arrive that way -- so they are deliberately absent from the list.
files:
  - dist/**/*
  - package.json

# Where the app looks for a new version.
#
# GitHub to begin with, because the repository is public and so this needs
# no token, no server work and nothing deployed: it proves the updating
# itself works before any of it is moved in-house.
#
# It is not where this should end up. An office LAN may have no way out at
# all, and 150 machines each pulling 80 MB from github.com is a lot of
# somebody's internet connection for a file that could have come off the
# server PC next door.
publish:
  provider: github
  owner: hellqimiclaude
  repo: BetSend

# There is no native module to rebuild, and in an npm workspace this step
# reaches the repository root and prunes every dev dependency it finds there,
# leaving the checkout unable to typecheck or test. Nothing to gain, a broken
# tree to lose.
npmRebuild: false

# Only Windows is shipped, but the Linux target is what the build gets
# verified on, so give it a sane executable name too -- the default is derived
# from the scoped package name and comes out as "@betsenddesktop".
linux:
  executableName: betsend
  target: dir
  category: Network

win:
  target: nsis
  icon: build/icon.png
  # No code signing configured. Windows will warn about an unknown publisher
  # until a certificate is set up; see the README.
  # Nothing is signed, so there is no publisher name for the updater to
  # check against. Left on, it refuses every update it downloads.
  verifyUpdateCodeSignature: false

nsis:
  # Adds the Explorer right-click entry on install and removes it on
  # uninstall. See build/installer.nsh.
  include: build/installer.nsh

  # Named explicitly. The default is "${productName} Setup ${version}.exe",
  # which lands next to the server's "BetSend-Setup-1.1.3.exe" differing only
  # in punctuation -- two installers in one release that nobody could tell
  # apart at a glance, for a machine where running the wrong one matters.
  artifactName: BetSend-Desktop-Setup-${version}.${ext}

  # Per-user by default, so a colleague without local administrator rights can
  # still install it. An IT deployment can pass /ALLUSERS to override.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BetSend
  # Leaving the settings file behind means a reinstall does not ask for the
  # server address again.
  deleteAppDataOnUninstall: false
