name: Installer

on:
  push:
    branches: ['**']
    # Pushing a v-tag is how a downloadable release gets cut.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        # Tag pushes are not always possible from where this gets driven, so a
        # release can also be cut by dispatching this workflow with a tag name.
        description: 'Publish a release under this tag (e.g. v1.1.0). Leave empty to only build.'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # Needed to create the release and attach the installer to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Produces dist-payload\: the built app, its runtime dependencies and a
      # bundled node.exe. Fails loudly if better-sqlite3 did not bring a
      # Windows binary, since that is what sends people hunting for a C++
      # compiler.
      - name: Build the payload
        shell: powershell
        run: ./installer/build-payload.ps1

      - name: Compile the installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not on this runner at $iscc" }
          & $iscc /DAppVersion=1.1.7 installer\BetSend.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Get-ChildItem dist-installer

      # The part that matters: install it the way an office PC would, then
      # check BetSend is actually serving. Everything before this only proves
      # the package compiles.
      - name: Install it silently and prove it serves
        shell: powershell
        run: |
          $setup = (Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1).FullName
          Write-Host "running $setup"

          $run = Start-Process -FilePath $setup `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' `
                   -PassThru -Wait
          if ($run.ExitCode -ne 0) {
            Get-Content install.log -Tail 60
            throw "the installer exited with $($run.ExitCode)"
          }

          $app = "${env:ProgramFiles}\BetSend"
          foreach ($required in 'node\node.exe','server\dist\index.js','server\public\index.html','config.json') {
            if (-not (Test-Path (Join-Path $app $required))) { throw "missing after install: $required" }
          }

          $config = Get-Content (Join-Path $app 'config.json') -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.adminToken)) { throw 'no admin token was generated' }
          if ($config.adminToken -eq 'change-me')               { throw 'admin token left at the default' }

          # The installer registers a startup task and starts it, so BetSend
          # should already be answering without anything else being run.
          $up = $false
          foreach ($attempt in 1..45) {
            Start-Sleep -Seconds 1
            try {
              $health = Invoke-WebRequest -Uri "http://127.0.0.1:$($config.port)/api/health" -UseBasicParsing -TimeoutSec 2
              if ($health.StatusCode -eq 200) { $up = $true; break }
            } catch { }
          }
          if (-not $up) {
            Get-Content (Join-Path $app 'logs\betsend.log') -Tail 40 -ErrorAction SilentlyContinue
            throw 'BetSend did not answer after a silent install'
          }
          Write-Host 'BetSend answered /api/health after a silent install'

          # Answering is not proof it read config.json: fall back to defaults
          # and the port is the same 8080 the wizard writes. The admin token
          # is the difference -- on defaults it is "change-me", so the
          # generated one would be refused. This is what would have caught a
          # server quietly running on defaults against an empty database.
          try {
            $verify = Invoke-WebRequest -Uri "http://127.0.0.1:$($config.port)/api/admin/verify" `
                        -Method POST -UseBasicParsing -TimeoutSec 5 `
                        -ContentType 'application/json' -Body '{}' `
                        -Headers @{ 'X-Admin-Token' = $config.adminToken }
            if ($verify.StatusCode -ne 200) { throw "status $($verify.StatusCode)" }
          } catch {
            # Print what the server actually said and what it logged. A 403
            # means the wrong configuration; anything else is its own bug.
            $detail = $_.Exception.Message
            $failure = $_.Exception.Response
            if ($failure) {
              try {
                $reader = New-Object System.IO.StreamReader($failure.GetResponseStream())
                $detail = "$detail -- body: $($reader.ReadToEnd())"
              } catch { }
            }
            Write-Host '--- server log ---'
            Get-Content (Join-Path $app 'logs\betsend.log') -Tail 80 -ErrorAction SilentlyContinue
            Write-Host '--- end server log ---'
            throw "/api/admin/verify did not accept the installed admin token: $detail"
          }
          Write-Host 'the running server is reading the installed config.json'

          # And the web interface is really being served, not just the API.
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:$($config.port)/" -UseBasicParsing
          if ($page.Content -notmatch 'BetSend') { throw 'the web interface did not load' }
          Write-Host 'the web interface loads'

      # Installing over a running copy is the normal case after the first
      # release, and it was broken: the server holds node.exe open and Setup
      # stops with "DeleteFile failed; code 5. Access is denied." Nothing
      # here installed twice, so nothing noticed.
      - name: Upgrade over the running install
        shell: powershell
        run: |
          $setup = (Get-ChildItem dist-installer -Filter '*.exe' | Select-Object -First 1).FullName
          $app = "${env:ProgramFiles}\BetSend"

          if (-not (Get-Process node -ErrorAction SilentlyContinue |
                    Where-Object { $_.Path -like "$app\*" })) {
            throw 'BetSend is not running, so this would not test an upgrade at all'
          }

          $run = Start-Process -FilePath $setup `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=upgrade.log' `
                   -PassThru -Wait
          if ($run.ExitCode -ne 0) {
            Get-Content upgrade.log -Tail 60
            throw "upgrading over a running install exited with $($run.ExitCode)"
          }

          # A locked file makes Setup skip it rather than fail outright under
          # /VERYSILENT, so the exit code alone does not prove much.
          $skipped = Select-String -Path upgrade.log -Pattern 'Access is denied|DeleteFile failed' -SimpleMatch
          if ($skipped) {
            $skipped | ForEach-Object { Write-Host $_.Line }
            throw 'the upgrade could not replace files that were in use'
          }

          $config = Get-Content (Join-Path $app 'config.json') -Raw | ConvertFrom-Json
          $up = $false
          foreach ($attempt in 1..45) {
            Start-Sleep -Seconds 1
            try {
              if ((Invoke-WebRequest -Uri "http://127.0.0.1:$($config.port)/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                $up = $true; break
              }
            } catch { }
          }
          if (-not $up) { throw 'BetSend did not come back after the upgrade' }
          Write-Host 'upgraded over a running install, and it is serving again'

      - name: Uninstall cleanly
        shell: powershell
        run: |
          $uninstaller = Get-ChildItem "${env:ProgramFiles}\BetSend" -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'no uninstaller was installed' }

          $run = Start-Process -FilePath $uninstaller.FullName `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "uninstall exited with $($run.ExitCode)" }

          Start-Sleep -Seconds 5
          if (Get-ScheduledTask -TaskName 'BetSend' -ErrorAction SilentlyContinue) {
            throw 'the startup task survived uninstallation'
          }
          Write-Host 'uninstalled, and the startup task is gone'

      - uses: actions/upload-artifact@v4
        with:
          name: BetSend-Setup
          path: dist-installer/*.exe
          if-no-files-found: error

      # --- the desktop client ------------------------------------------------
      # A separate installer. The server above is what runs in the office; this
      # is what a colleague puts on their own machine instead of using a
      # browser tab.
      - name: Build the desktop app
        shell: powershell
        run: |
          # The repo .npmrc blocks install scripts, which is what stops npm
          # compiling better-sqlite3 -- but it also stops Electron fetching its
          # own runtime. Ask for that one explicitly rather than lifting the
          # rule for everything.
          npm rebuild electron --no-ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'could not fetch the Electron runtime' }

          npm run build -w desktop
          if ($LASTEXITCODE -ne 0) { throw 'the desktop build failed' }

          npm run package -w desktop
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed' }

          Get-ChildItem dist-desktop -Filter *.exe | ForEach-Object {
            Write-Host ("  {0} ({1:n1} MB)" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Check the desktop installer exists
        shell: powershell
        run: |
          $setup = Get-ChildItem dist-desktop -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'electron-builder produced no installer' }
          # Under 20 MB would mean the Electron runtime did not make it in.
          if ($setup.Length -lt 20MB) { throw "the desktop installer is only $([math]::Round($setup.Length/1MB,1)) MB - the runtime is missing" }
          Write-Host "desktop installer: $($setup.Name)"

      # Building an installer proves only that electron-builder ran. This
      # runs the thing: a silent install, then a look at what it actually did
      # to the machine. The right-click verb and the firewall rule are both
      # written by hand in installer.nsh, where a typo produces a perfectly
      # valid installer that quietly does nothing.
      - name: Install it and check what it changed
        shell: powershell
        run: |
          $setup = Get-ChildItem dist-desktop -Filter '*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Write-Host "installed $($setup.Name)"

          $verb = 'HKCU:\Software\Classes\*\shell\BetSend\command'
          if (-not (Test-Path $verb)) { throw 'the Explorer right-click entry was not written' }
          $command = (Get-ItemProperty $verb).'(default)'
          Write-Host "right-click command: $command"
          # --send="%1", attached. A space would be separated from its value
          # by Chromium's own command-line rewriting before the app saw it.
          if ($command -notmatch '--send="%1"') { throw "the right-click command is wrong: $command" }

          # The runner is elevated, so the silent branch's netsh call applies.
          $rule = netsh advfirewall firewall show rule name="BetSend direct transfers" 2>&1 | Out-String
          Write-Host $rule
          if ($rule -notmatch 'BetSend direct transfers') { throw 'the firewall rule was not added' }
          if ($rule -notmatch 'Profiles:.*Public') {
            throw 'the firewall rule does not cover every profile; an office LAN classified Public would block it'
          }
          if ($rule -notmatch 'Enabled:\s+Yes') { throw 'the firewall rule was added disabled' }

          # Adding it twice must not stack up duplicate rules.
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $count = ([regex]::Matches((netsh advfirewall firewall show rule name="BetSend direct transfers" | Out-String), 'Rule Name:')).Count
          if ($count -ne 1) { throw "reinstalling left $count copies of the firewall rule" }
          Write-Host 'reinstall left exactly one rule'

      - uses: actions/upload-artifact@v4
        with:
          name: BetSend-Desktop
          path: dist-desktop/*.exe
          if-no-files-found: error

      # The artifact above can only be fetched by somebody signed in to GitHub
      # with access to this repository, which is no use for handing the
      # installer to a colleague. A release asset is a plain public download.
      - name: Publish the release
        if: >-
          inputs.release_tag != ''
          || startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"

          # Nothing is code-signed, so the checksums are the only way somebody
          # can tell the file they downloaded is the one this build produced.
          # Published with the release rather than alongside it, so there is
          # one less thing to go missing.
          notes=release-notes.md
          cp installer/RELEASE_NOTES.md "$notes"
          {
            echo
            echo '### Checksums (SHA-256)'
            echo
            for exe in dist-installer/*.exe dist-desktop/*.exe; do
              printf '`%s`  \n`%s`\n\n' "$(basename "$exe")" "$(sha256sum "$exe" | cut -d' ' -f1)"
            done
          } >> "$notes"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            # --target so the tag is created on the commit that was built,
            # rather than wherever the default branch happens to be.
            gh release create "$tag" --title "BetSend $tag" \
                              --target "$GITHUB_SHA" \
                              --notes-file "$notes"
          else
            gh release edit "$tag" --notes-file "$notes"
          fi

          gh release upload "$tag" dist-installer/*.exe dist-desktop/*.exe --clobber
          echo "Server installer and desktop app attached to $tag"
        env:
          GH_TOKEN: ${{ github.token }}
